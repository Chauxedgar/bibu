version: '3.9'

services:

  # ─────────────────────────────────────────
  # Contenedor 1: Base de datos MySQL
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: crud_clientes_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: crud_clientes
      MYSQL_USER: nuevo
      MYSQL_PASSWORD: nuevo123
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unuevo", "-pnuevo123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Contenedor 2: PHP 8.2 + Apache (sin cambios)
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_clientes_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────
  # Contenedor 3: Django + DRF  ← NUEVO
  # Puerto 8000 para no chocar con PHP (8080)
  # ─────────────────────────────────────────
  django:
    build:
      context: ./django_api
      dockerfile: Dockerfile
    container_name: crud_clientes_django
    restart: unless-stopped
    ports:
      - "8000:8000"           # API disponible en http://localhost:8000
    volumes:
      - ./django_api:/app     # hot-reload: cambios en código se reflejan al instante
    environment:
      - DB_HOST=db
      - DB_NAME=crud_clientes
      - DB_USER=nuevo
      - DB_PASSWORD=nuevo123
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # ─────────────────────────────────────────
  # phpMyAdmin
  # ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: crud_clientes_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: nuevo
      PMA_PASSWORD: nuevo123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
