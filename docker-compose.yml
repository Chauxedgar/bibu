version: '3.9'

services:

  # ─────────────────────────────────────────
  # Contenedor 1: Base de datos MySQL
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: crud_clientes_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: crud_clientes
      MYSQL_USER: nuevo
      MYSQL_PASSWORD: nuevo123
    volumes:
      - db_data:/var/lib/mysql          # datos persistentes
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # script inicial (opcional)
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unuevo", "-pnuevo123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Contenedor 2: PHP 8.2 + Apache
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_clientes_app
    restart: unless-stopped
    ports:
      - "8080:80"           # accede en http://localhost:8080
    volumes:
      - ./src:/var/www/html # tu código fuente va en la carpeta src/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────
  # phpMyAdmin (opcional, para administrar BD)
  # ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: crud_clientes_pma
    restart: unless-stopped
    ports:
      - "8081:80"           # accede en http://localhost:8081
    environment:
      PMA_HOST: db
      PMA_USER: nuevo
      PMA_PASSWORD: nuevo123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

# ─────────────────────────────────────────
# Volúmenes y red compartida
# ─────────────────────────────────────────
volumes:
  db_data:

networks:
  app_network:
    driver: bridge
